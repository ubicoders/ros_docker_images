version: "3.8"

services: 
  zed_ros2_srv:
      container_name: zed_ros2_cnt      
      build: .
      image: ubicoders/ros2:u22_cuda12.1_zed
      network_mode: host
      privileged: true
      stdin_open: true # docker run -i
      tty: true        # docker run -t
      environment:
        - DISPLAY
        - QT_X11_NO_MITSHM=1 
      volumes:
        - "/tmp/.X11-unix/:/tmp/.X11-unix/:rw"
        - "$HOME/.Xauthority:/root/.Xauthority:rw"
        - "/dev/:/dev/"  
      runtime: nvidia
      deploy:
        resources:
            reservations:
                devices:
                - driver: nvidia
                  count: all
                  capabilities: [gpu, compute, utility, graphics, compat32, video, display]